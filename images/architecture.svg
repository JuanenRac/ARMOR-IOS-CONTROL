<title id="t">ARMOR-IOS-CONTROL architecture</title>
<desc id="d">ARMOR-IOS-CONTROL reads and orders through ARMOR-SERVER and nothing else. The rules of the app are the Swift package ArmorCore (146 tests, run with swift test on macOS or Linux); the SwiftUI screens and the parts that need an iPhone (Face ID, the Keychain, the certificate rules, live camera and push) have not been built in Xcode or run.</desc>
